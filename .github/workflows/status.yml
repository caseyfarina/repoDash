name: mission-control

on:
  schedule:
    - cron: "17 * * * *"      # hourly at :17 (avoids top-of-hour congestion)
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]
    paths:                     # rebuild when the builder itself changes
      - "bin/build-data.mjs"
      - ".github/workflows/status.yml"

permissions:
  contents: write              # to commit docs/data.json back to this repo

concurrency:
  group: mission-control
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build docs/data.json from the GitHub API
        env:
          MC_TOKEN: ${{ secrets.MC_TOKEN }}   # fine-grained PAT, Contents+Metadata read
          MC_MONTHS: "4"
          MC_STALE_DAYS: "14"
          MC_EXCLUDE_ARCHIVED: "true"
          MC_EXCLUDE_FORKS: "false"
        run: node bin/build-data.mjs

      - name: Commit if changed
        run: |
          git config user.name "mission-control[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "no status change — nothing to commit"
            exit 0
          fi
          git commit -m "status: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
